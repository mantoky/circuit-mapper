# Circuit Mapper — nginx (VPS techartsolucoes.com.br)
# ----------------------------------------------------------------------
# Subdominio: circuit-mapper.techartsolucoes.com.br
# Serve apenas a PWA estatica (pasta dist/). HTTPS obrigatorio (Let's Encrypt).
#
# Instalacao:
#   sudo cp circuit-mapper.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/circuit-mapper.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d circuit-mapper.techartsolucoes.com.br   (HTTPS auto)
#
# Deploy do conteudo (a partir do Cursor, via SSH):
#   scp -r dist/* <user>@<vps>:/var/www/circuit-mapper/
# ----------------------------------------------------------------------

# Redireciona HTTP -> HTTPS (security-first)
server {
    listen 80;
    listen [::]:80;
    server_name circuit-mapper.techartsolucoes.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name circuit-mapper.techartsolucoes.com.br;

    # Certificados gerados pelo certbot (preencher apos o primeiro run)
    # ssl_certificate     /etc/letsencrypt/live/circuit-mapper.techartsolucoes.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/circuit-mapper.techartsolucoes.com.br/privkey.pem;

    root /var/www/circuit-mapper;
    index CIRCUIT-MAPPER.html;

    # ---------- Seguranca (headers) ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # ---------- PWA: raiz serve o app ----------
    location = / {
        try_files /CIRCUIT-MAPPER.html =404;
    }
    location / {
        try_files $uri $uri/ /CIRCUIT-MAPPER.html;
    }

    # Service Worker: nunca cacheado pelo navegador/CDN (precisa buscar atualizacoes)
    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        default_type application/javascript;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600" always;
        default_type application/manifest+json;
    }

    # Icones: cache longo (imutaveis por build)
    location ~* \.(png|ico|svg)$ {
        add_header Cache-Control "public, max-age=604800" always;
    }

    # HTML principal: revalida sempre (atualizacoes da PWA)
    location = /CIRCUIT-MAPPER.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Compressao
    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;
    gzip_vary on;
}
