# Flash Report TI/LTE — nginx (VPS techartsolucoes.com.br)
# Subdominio: falha-ti-lte.techartsolucoes.com.br
# Nao conflita com circuit-mapper nem report-flash.

server {
    listen 80;
    listen [::]:80;
    server_name falha-ti-lte.techartsolucoes.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name falha-ti-lte.techartsolucoes.com.br;

    # ssl_certificate     /etc/letsencrypt/live/falha-ti-lte.techartsolucoes.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/falha-ti-lte.techartsolucoes.com.br/privkey.pem;

    root /var/www/falha-ti-lte;
    index FLASH-REPORT.html index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;

    location = / {
        try_files /FLASH-REPORT.html =404;
    }
    location / {
        try_files $uri $uri/ /FLASH-REPORT.html;
    }
    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        default_type application/javascript;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600" always;
        default_type application/manifest+json;
    }
    location ~* \.(png|ico|svg)$ {
        add_header Cache-Control "public, max-age=604800" always;
    }
    location = /FLASH-REPORT.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;
    gzip_vary on;
}
